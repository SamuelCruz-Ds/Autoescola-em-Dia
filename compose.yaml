services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_NAME:-autoescola}"
      MYSQL_USER: "${DB_USER:-autoescola}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no arquivo .env}"
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - dados:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  dados:
